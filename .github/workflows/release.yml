name: Release

# Builds the installer from a version tag and attaches it to a DRAFT release.
# Nothing is published automatically: review the draft on GitHub, then publish it.
#
#   git tag v0.1.1 && git push origin v0.1.1

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.1)"
        required: true

permissions:
  contents: write
  actions: read # CI sonucunu okumak için

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "4"
  VPK_VERSION: "1.2.161" # must match the velopack crate in Cargo.toml

jobs:
  release:
    name: Build and package (Windows)
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2

      - name: Install ARM64 Rust target
        run: rustup target add aarch64-pc-windows-msvc

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Check tag matches Cargo.toml
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne $env:TAG) { throw "Tag $env:TAG does not match Cargo.toml version $v" }

      - name: Install vpk
        run: dotnet tool install vpk --version ${{ env.VPK_VERSION }} --tool-path .tools/vpk

      # Aynı commit CI'da (build, test, lint) zaten geçtiyse testler yeniden
      # koşulmaz (~13 dk). CI yoksa, iptal edildiyse (yeni push onu iptal
      # eder) ya da bulunamadıysa testler burada koşar; CI düştüyse sürüm durur.
      - name: Check CI result for this commit
        id: ci
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          for ($i = 0; $i -lt 60; $i++) {
            $runs = @(gh run list --workflow CI --commit $sha --json status,conclusion | ConvertFrom-Json)
            if ($runs | Where-Object conclusion -eq 'success') { "CI passed for $sha"; "tested=true" >> $env:GITHUB_OUTPUT; exit 0 }
            if ($runs | Where-Object conclusion -eq 'failure') { throw "CI failed for $sha" }
            if (-not ($runs | Where-Object status -ne 'completed')) { break }
            "CI still running for $sha, waiting..."
            Start-Sleep -Seconds 30
          }
          "No passing CI run for $sha; tests will run here"
          "tested=false" >> $env:GITHUB_OUTPUT

      - name: Test
        if: steps.ci.outputs.tested != 'true'
        run: cargo test --release --locked

      # Keep both architecture feeds and full packages available for rollback.
      - name: Fetch previous release package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/velopack | Out-Null
          $prev = gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName'
          if ($prev -and $prev -ne $env:TAG) {
            gh release download $prev --pattern '*-full.nupkg' --pattern 'releases.win.json' --pattern 'releases.win-arm64.json' --dir target/velopack
            "Previous release: $prev"
          } else { "No previous release" }

      - name: Build and pack
        shell: pwsh
        run: |
          ./scripts/surum-hazirla.ps1 -Target x86_64-pc-windows-msvc -TargetDir target -Channel win
          ./scripts/surum-hazirla.ps1 -Target aarch64-pc-windows-msvc -TargetDir target -Channel win-arm64

      - name: Checksums
        shell: pwsh
        run: |
          Set-Location target/velopack
          Get-ChildItem -File | Where-Object Name -ne 'SHA256SUMS.txt' |
            Select-Object -ExpandProperty Name | Sort-Object |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_ } |
            Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Create draft release
        shell: pwsh
        run: |
          Set-Location target/velopack
          $files = @(Get-ChildItem -File | Select-Object -ExpandProperty Name)
          gh release create $env:TAG --draft --verify-tag --title "Openify $($env:TAG.TrimStart('v'))" --generate-notes @files
