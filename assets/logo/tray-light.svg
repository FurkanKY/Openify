    <rect width="256" height="256" fill="#fff"/><circle cx="187.4" cy="68.6" r="44" fill="#000"/>
  </mask>
</defs>
<circle cx="128" cy="128" r="84" fill="none" stroke="#0E0E10" stroke-width="48" mask="url(#notch)"/>
